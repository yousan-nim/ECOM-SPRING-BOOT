spring:
  application:
    name: catalog-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USERNAME:catalog}
    password: ${DB_PASSWORD:catalog}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}
  compression: { enabled: true }
  error: { include-message: always, include-binding-errors: always }
  shutdown: graceful

management:
  endpoints: { web: { exposure: { include: health,info,metrics,prometheus } } }
  endpoint: { health: { show-details: when_authorized, probes: { enabled: true } } }

springdoc:
  api-docs: { path: /v3/api-docs }
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  version: @project.version@
  jwt:
    # ⚠️ Dev-only secret. Override JWT_SECRET in production (≥ 32 bytes).
    secret: ${JWT_SECRET:dev-secret-please-change-in-production-min-32-bytes-required-for-hs256}
    issuer: ${JWT_ISSUER:ecom-catalog}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}    # 15 minutes
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}    # 7 days

logging:
  level:
    root: INFO
    com.ecom.catalog: DEBUG
