spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USERNAME:user_svc}
    password: ${DB_PASSWORD:user_svc}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    com.ecom.user: DEBUG
    org.hibernate.SQL: DEBUG
