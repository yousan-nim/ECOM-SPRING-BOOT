spring:
  application:
    name: payment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/payment_db}
    username: ${DB_USERNAME:paymentuser}
    password: ${DB_PASSWORD:paymentpass}
    hikari: { maximum-pool-size: 20, minimum-idle: 5, connection-timeout: 30000 }

  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  # Honour X-Forwarded-* from the gateway (swagger behind /swagger/payment).
  forward-headers-strategy: framework

management:
  endpoints: { web: { exposure: { include: health,info,metrics,prometheus } } }
  endpoint: { health: { probes: { enabled: true } } }

springdoc:
  api-docs: { path: /v3/api-docs, enabled: "${SWAGGER_ENABLED:true}" }
  swagger-ui: { enabled: "${SWAGGER_ENABLED:true}", path: /swagger-ui.html, operations-sorter: method }

app:
  version: @project.version@
  services:
    catalog: ${CATALOG_BASE_URL:http://catalog-service:8081}
    order:   ${ORDER_BASE_URL:http://order-service:8082}

logging:
  level: { root: INFO, com.ecom.payment: DEBUG }
