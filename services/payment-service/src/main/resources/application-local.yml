spring:
  datasource:
    # Env-overridable so the same profile works both ways:
    #   - from the IDE (no env)      → localhost host-mapped port
    #   - in a container (--profile full) → DB_URL points at postgres-payment
    url: ${DB_URL:jdbc:postgresql://localhost:5434/payment_db}
    username: ${DB_USERNAME:paymentuser}
    password: ${DB_PASSWORD:paymentpass}
  jpa:
    show-sql: true
    properties: { hibernate: { format_sql: true } }

app:
  services:
    catalog: ${CATALOG_BASE_URL:http://localhost:8081}
    order:   ${ORDER_BASE_URL:http://localhost:8082}
