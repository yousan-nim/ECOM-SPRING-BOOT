spring:
  application:
    name: order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${DB_USERNAME:orderuser}
    password: ${DB_PASSWORD:orderpass}
    hikari: { maximum-pool-size: 20, minimum-idle: 5, connection-timeout: 30000 }

  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
    properties: { hibernate: { jdbc.batch_size: 30, order_inserts: true } }

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  # Honour X-Forwarded-* from the gateway (swagger behind /swagger/order).
  forward-headers-strategy: framework

management:
  endpoints: { web: { exposure: { include: health,info,metrics,prometheus } } }
  endpoint: { health: { probes: { enabled: true } } }

springdoc:
  api-docs: { path: /v3/api-docs, enabled: "${SWAGGER_ENABLED:true}" }
  swagger-ui: { enabled: "${SWAGGER_ENABLED:true}", path: /swagger-ui.html, operations-sorter: method }

app:
  version: @project.version@
  # Where to find sibling services (used for cross-service REST calls).
  services:
    catalog: ${CATALOG_BASE_URL:http://catalog-service:8081}
    payment: ${PAYMENT_BASE_URL:http://payment-service:8083}

logging:
  level: { root: INFO, com.ecom.order: DEBUG }
