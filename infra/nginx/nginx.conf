# API Gateway — unified API namespace.
#
# The public contract is ONE coherent API under /api/v1/*. Clients never
# see service names, so an endpoint can move between services without
# breaking the URL — only the gateway route changes.
#
# Routing is by resource prefix → owning service:
#   /api/v1/auth/*   , /api/v1/users/*        → user-service
#   /api/v1/products/*, /api/v1/vendors/* ... → catalog-service   (future)
#   /api/v1/orders/* , /api/v1/carts/*        → order-service     (future)
#   /api/v1/payments/*                        → payment-service   (future)
#
# Health/liveness (/api/v1/ping, /actuator/*) is intentionally NOT routed
# here — orchestrators probe each instance directly. The gateway exposes
# its own /healthz.
#
# Each upstream is the docker-compose service name on the internal network.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Logging (JSON for structured log shipping)
    log_format json escape=json
        '{"ts":"$time_iso8601","status":$status,"method":"$request_method",'
        '"uri":"$request_uri","upstream":"$upstream_addr",'
        '"rt":$request_time,"ut":"$upstream_response_time","ua":"$http_user_agent"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    upstream user_upstream    { server user-service:8084; }
    upstream catalog_upstream { server catalog-service:8081; }
    upstream order_upstream   { server order-service:8082; }
    upstream payment_upstream { server payment-service:8083; }

    server {
        listen 80 default_server;
        server_name _;

        # The gateway is published on host port 8080 but listens on 80 inside
        # the container. Emit RELATIVE redirects so the browser keeps the
        # original host:port (localhost:8080) instead of being sent to :80.
        absolute_redirect off;

        # Common proxy settings — inherited by every location below
        # (NB: do not add a proxy_set_header inside a location, or it
        #  resets inheritance and these are dropped for that location).
        # Use $http_host (not $host) so the forwarded Host carries the
        # :8080 port — springdoc builds its absolute URLs from it.
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Health for the gateway itself ────────────────────
        location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

        # ── user-service ─────────────────────────────────────
        # No rewrite: the service sees the same /api/v1/... path the client sent.
        location /api/v1/auth/  { proxy_pass http://user_upstream; }
        location /api/v1/users  { proxy_pass http://user_upstream; }

        # ── catalog-service (no controllers yet — uncomment per resource) ─
        # location /api/v1/products   { proxy_pass http://catalog_upstream; }
        # location /api/v1/vendors    { proxy_pass http://catalog_upstream; }
        # location /api/v1/categories { proxy_pass http://catalog_upstream; }
        # location /api/v1/inventory  { proxy_pass http://catalog_upstream; }

        # ── order-service (future) ───────────────────────────
        # location /api/v1/orders { proxy_pass http://order_upstream; }
        # location /api/v1/carts  { proxy_pass http://order_upstream; }

        # ── payment-service (future) ─────────────────────────
        # location /api/v1/payments { proxy_pass http://payment_upstream; }

        # ── Swagger UI per service ───────────────────────────
        # Each service's API docs are exposed under /swagger/<service>/.
        # The trailing slash on proxy_pass strips the prefix before it
        # reaches the backend; X-Forwarded-Prefix lets springdoc rebuild
        # the swagger-config / api-docs URLs with the prefix so the UI's
        # assets and JSON resolve correctly through the gateway.
        # NB: re-declaring proxy_set_header here resets header inheritance,
        # so the common forwarded headers are repeated in each block.
        location = /swagger         { return 302 /swagger/user/swagger-ui/index.html; }

        location = /swagger/user    { return 302 /swagger/user/swagger-ui/index.html; }
        location /swagger/user/ {
            proxy_pass http://user_upstream/;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /swagger/user;
        }

        location = /swagger/catalog { return 302 /swagger/catalog/swagger-ui/index.html; }
        location /swagger/catalog/ {
            proxy_pass http://catalog_upstream/;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /swagger/catalog;
        }

        location = /swagger/order   { return 302 /swagger/order/swagger-ui/index.html; }
        location /swagger/order/ {
            proxy_pass http://order_upstream/;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /swagger/order;
        }

        location = /swagger/payment { return 302 /swagger/payment/swagger-ui/index.html; }
        location /swagger/payment/ {
            proxy_pass http://payment_upstream/;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /swagger/payment;
        }

        # Friendly root.
        location = / {
            default_type application/json;
            return 200 '{"service":"ecom-gateway","api":"/api/v1","docs":["/swagger/user","/swagger/catalog","/swagger/order","/swagger/payment"],"live":["/api/v1/auth/","/api/v1/users"]}';
        }
    }
}
